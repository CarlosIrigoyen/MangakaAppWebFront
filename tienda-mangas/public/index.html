<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Mangaka Baka Shop - Tu tienda de mangas favorita. Compra los mejores tomos de manga en español." />
    <meta name="keywords" content="manga, comics, tienda, comprar, tomos, español" />
    <meta name="author" content="Mangaka Baka Shop" />

    <title>Mangaka Baka Shop - Tu tienda de mangas favorita</title>

    <!-- Preconnect -->
    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin>
    <link rel="preconnect" href="https://mangakaappweb-production.up.railway.app" crossorigin>
    <link rel="dns-prefetch" href="https://res.cloudinary.com">
    <link rel="dns-prefetch" href="https://mangakaappweb-production.up.railway.app">

    <!-- Preload LCP (opcional) -->
    <link
      rel="preload"
      as="image"
      href="https://res.cloudinary.com/dcgyq3ajm/image/upload/w_400,q_50,f_webp/v1763416674/tomo_portada_chainsaw-man.jpg"
      fetchpriority="high"
      crossorigin="anonymous"
    />

    <!-- Preload CSS -->
    <link rel="preload" href="%PUBLIC_URL%/static/css/main.chunk.css" as="style">

    <style>
      :root { color-scheme: dark; }
      html,body{height:100%;margin:0;}
      body{
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial;
        background-color:#212529;
        color:#fff;
        -webkit-font-smoothing: antialiased;
      }

      /* Skip link para accesibilidad */
      .skip-link {
        position:absolute;
        left:-9999px;
        top:auto;
        width:1px;
        height:1px;
        overflow:hidden;
      }
      .skip-link:focus {
        left:1rem;
        top:1rem;
        width:auto;
        height:auto;
        padding:.5rem .75rem;
        background:#fff;
        color:#000;
        border-radius:6px;
        z-index:9999;
      }

      /* Loader inicial sin fondo blanco */
      .initial-loading {
        display:flex;
        align-items:center;
        justify-content:center;
        height:100vh;
        background:#212529; /* 🔥 evita fondo blanco */
      }
      .loading-spinner {
        width:40px;
        height:40px;
        border:4px solid rgba(255,255,255,0.2);
        border-top:4px solid #0d6efd;
        border-radius:50%;
        animation:spin 1s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }

      :focus { outline: 3px solid rgba(13,110,253,0.28); outline-offset: 2px; }
    </style>

    <noscript>
      <link rel="stylesheet" href="%PUBLIC_URL%/static/css/main.chunk.css">
    </noscript>
  </head>

  <body>
    <a class="skip-link" href="#main-content">Saltar al contenido</a>

    <!-- Loader inicial (ya sin placeholder blanco) -->
    <main id="main-content" role="main" aria-label="Contenido principal">
      <div class="initial-loading" id="initial-loading">
        <div class="loading-spinner"></div>
      </div>
    </main>

    <!-- React root -->
    <div id="root" aria-live="polite"></div>

    <!-- CSS asíncrono -->
    <script>
      (function() {
        var href = '%PUBLIC_URL%/static/css/main.chunk.css';
        var link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = href;

        link.onload = function() {
          var init = document.getElementById('initial-loading');
          if (init) init.style.display = 'none';
        };

        document.head.appendChild(link);
      })();
    </script>

    <!-- Foco accesible del skip link -->
    <script>
      (function() {
        var skip = document.querySelector('.skip-link');
        if (!skip) return;
        skip.addEventListener('click', function() {
          var main = document.getElementById('main-content');
          if (main) {
            main.setAttribute('tabindex', '-1');
            main.focus();
          }
        });
      })();
    </script>

  </body>
</html>
